<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cheapshot | Capture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon/favicon-192x192.png" sizes="192x192" />
    <style>
      body {
        padding: 0;
        height: 100svh;
        width: 100svw;
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        flex-direction: column;
        margin: 0;
        overflow: hidden;
      }
      .trigger {
        aspect-ratio: 1/1;
        height: clamp(100px, 20svh, 250px);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 55, 55, 1) 0%,
          rgba(193, 10, 10, 1) 100%
        );
        border: none;
        cursor: pointer;
        font-size: clamp(16px, 300%, 75px);
        color: white;
      }
      .trigger:disabled {
        background: #d6d3d1;
        color: #a0a0a0;
        cursor: not-allowed;
        pointer-events: none;
      }
      .preview {
        background: #d6d3d1;
        border-radius: 10px;
        height: clamp(100px, 75svh, 600px);
        aspect-ratio: 3/4;
      }
      .preview video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 10px;
      }
      .countdown {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.2);
        -webkit-backdrop-filter: blur(5px);
        backdrop-filter: blur(5px);
        color: white;
        font-size: 10rem;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
      }
      .countdown.visible {
        visibility: visible;
        opacity: 1;
        pointer-events: none;
      }
      .error-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #dc2626;
        color: #fef2f2;
        padding: 3rem 1rem;
        box-shadow: 0 1px 10px #dc2626;
        box-sizing: border-box;
        font-size: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }
      .error-overlay.visible {
        visibility: visible;
        opacity: 1;
        pointer-events: all;
      }
      #loadingIndicator {
        visibility: hidden;
        position: fixed;
        top: 10svh;
        left: 50%;
        transform: translateX(-50%);
        width: 5rem;
        height: 5rem;

        &.visible {
          visibility: visible;
        }
      }

      #statusMessage {
        visibility: hidden;
        position: fixed;
        bottom: 1rem;
        background: #e7e5e4;
        padding: 1rem;
        border-radius: 5px;
        width: 90svw;
        text-align: center;
        font-size: 1.125rem;
        border: 2px solid #a8a29e;

        &.visible {
          visibility: visible;
        }

        &.error {
          background: #f5f5f4;
          border: 2px solid #b91c1c;
          color: #b91c1c;
        }
      }
    </style>
  </head>
  <body>
    <div class="preview">
      <video autoplay playsinline id="videoStream"></video>
    </div>
    <button class="trigger">📸</button>
    <div class="countdown">3</div>
    <div class="error-overlay"></div>
    <button class="startpreview">Start Preview</button>
    <svg
      id="loadingIndicator"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z"
        opacity=".25"
      />
      <path
        d="M10.14,1.16a11,11,0,0,0-9,8.92A1.59,1.59,0,0,0,2.46,12,1.52,1.52,0,0,0,4.11,10.7a8,8,0,0,1,6.66-6.61A1.42,1.42,0,0,0,12,2.69h0A1.57,1.57,0,0,0,10.14,1.16Z"
      >
        <animateTransform
          attributeName="transform"
          type="rotate"
          dur="0.75s"
          values="0 12 12;360 12 12"
          repeatCount="indefinite"
        />
      </path>
    </svg>
    <span id="statusMessage">Loading...</span>
    <script src="/js/capture.js" type="module"></script>
  </body>
</html>
